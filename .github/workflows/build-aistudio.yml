name: Build AIStudio

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pake-cli
        run: npm install -g pnpm@10.26.2 && npm install -g pake-cli

      - name: Build Windows app
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          pake "https://aistudio.google.com/apps?source=user&tag=created-by-you" --name AIStudio --identifier com.pake.aistudio --safe-domain accounts.google.com,google.com,aistudio.google.com --new-window --force-internal-navigation --width 1280 --height 800 --json

      - name: List outputs
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.msi,*.exe | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Windows MSI/EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Windows
          path: |
            *.msi
            *.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 7
